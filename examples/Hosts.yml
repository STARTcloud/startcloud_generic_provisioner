# core_provisioner_version: 0.2.12
# provisioner_name: startcloud_generic_provisioner
# provisioner_version: 0.3.2 # x-release-please-version
#
# Example Hosts.yml for plain vagrant use (no platform wizard).
# Instructions (paths are relative to the repository root):
# 1. Copy this file to the repository root as Hosts.yml (it is gitignored)
# 2. Update all `REPLACEME` entries in the file
# 3. Optional changes:
#   a. networks — by default this uses DHCP on a bridged interface; set address/gateway/bridge for static setups
#   b. roles — this is a generic provisioner: append the startcloud.startcloud_roles you need
#      (see metadata.roles in provisioner.yml for the picker roles and their dependencies)
---
hosts:
  -
    settings:
      # Vagrant Debug
      debug_build: true

      # Identifiers
      hostname: REPLACEME #generic-server
      domain: REPLACEME #startcloud.com
      server_id: REPLACEME #'1234'

      # Extra Actions
      post_provision: true ## This calls extra things after Ansible completes, like syncing the new SSH key from the lockdown role, or the id_files or the support bundle

      # Resources
      vcpus: 2
      memory: 4G

      # Console Access
      consoleport: REPLACEME #'1234'
      consolehost: 0.0.0.0
      show_console: false

      # Box information
      box: 'STARTcloud/debian13-server'
      box_url: 'https://boxvault.startcloud.com'
      box_version: 2025.8.13
      box_arch: amd64

      # Provider Specific Settings
      provider_type: virtualbox
      os_type: 'Debian_64'
      firmware_type: UEFI

      # Setup Variables
      setup_wait: 420

      # Vagrant Configurations
      vagrant_user: startcloud
      vagrant_user_pass: REPLACEME #'STARTcloud24@!'
      vagrant_user_private_key_path: ./id_rsa
      vagrant_ssh_insert_key: true
      vagrant_ssh_forward_agent: true
      vagrant_ssh_keep_alive: true
      vagrant_communicator: ssh

    plugins:
      install:
        -
          name: vagrant-scp-sync
          version: latest
#        -
#          name: vagrant-zones
#          version: latest
      remove:
        -
          name: vagrant-scp

    zones:
      vmtype: production
      brand: bhyve
      on_demand_vnics: true
      post_provision_boot: false
      console_onboot: false
      console: webvnc
      debug: false
      debug_boot: false
      hostbridge: i440fx
      acpi: on
      autostart: true
      setup_method: zlogin
      diskif: virtio
      netif: virtio-net-viona
      booted_string: 'Web console:'
      lcheck_string: ':~$'
      alcheck_string: 'login:'
      safe_restart: 'sudo shutdown -r'
      safe_shutdown: 'sudo init 0 || true'
      clean_shutdown_time: 200
      snapshot_script: '/opt/vagrant/bin/Snapshooter.sh'
      cpu_configuration: simple

    networks:
      -
        type: external
        address: 192.168.255.255
        netmask: 255.255.255.0
        gateway: 192.168.2.1
        autoconf: false
        vlan:
        dhcp4: true
        dhcp6: false
        is_control: false
        route: default
        provisional: false
        bridge:
        nic_type: virtio
        mac: auto
        dns:
          - nameserver: 1.1.1.1
          - nameserver: 1.0.0.1

    disks:
      boot:
        type: template
        volume_name: boot
        mount: /

      additional_disks:
        -
          type: blank
          size: 50G
          sparse: true
          volume_name: disk1
          mount: /local
          filesystem: xfs
          driver: virtio-scsi

    provisioning:
      shell:
        enabled: false
        scripts:
          - './scripts/aliases.sh'

      ansible:
        enabled: true
        playbooks:
          - local:
              -
                description: "This playbook imports Hosts.yml variables into a generated playbook: /vagrant/ansible/playbook.yml"
                playbook: ansible/generate-playbook.yml
                config_file: /vagrant/ansible/ansible.cfg
                ansible_python_interpreter: /usr/bin/python3
                compatibility_mode: 2.0
                install_mode: pip
                ssh_pipelining: true
                verbose: false
                callbacks: profile_tasks
                run: always
                remote_collections: false
                collections: []
              -
                description: "This playbook configures the machine using the generated playbook: /vagrant/ansible/playbook.yml"
                playbook: ansible/playbook.yml
                config_file: /vagrant/ansible/ansible.cfg
                ansible_python_interpreter: /usr/bin/python3
                compatibility_mode: 2.0
                install_mode: pip
                ssh_pipelining: true
                verbose: false
                callbacks: profile_tasks
                run: once
                remote_collections: false
                collections:
                  - startcloud.startcloud_roles
                  - startcloud.hcl_roles
              -
                description: "This playbook configures the machine for roles tagged as always, using the generated playbook: /vagrant/ansible/playbook.yml"
                playbook: ansible/always-playbook.yml
                config_file: /vagrant/ansible/ansible.cfg
                ansible_python_interpreter: /usr/bin/python3
                compatibility_mode: 2.0
                install_mode: pip
                ssh_pipelining: true
                verbose: false
                callbacks: profile_tasks
                run: not_first
                remote_collections: false
                collections:
                  - startcloud.startcloud_roles

    folders:
      -
        description: "Disables VBoxSF, do not enable"
        map: .
        to: /vagrant
        type: virtualbox
        disabled: true
        automount: true

      -
        description: "Directory for Ansible Scripts"
        map: ./provisioners/ansible/
        to: /vagrant/ansible/
        type: rsync
        args:
          - '--verbose'
          - '--archive'
          - '--delete'
          - '-z'
          - '--copy-links'

      -
        description: "Directory for Ansible Collections"
        map: ./provisioners/ansible_collections/
        to: /vagrant/ansible_collections/
        type: rsync
        args:
          - '--verbose'
          - '--archive'
          - '--delete'
          - '-z'
          - '--copy-links'

      -
        description: "Directory for Application Installers"
        map: ./installers/
        to: /vagrant/installers/
        type: rsync

      -
        description: "Directory for Pre-Signed SSLs"
        map: ./driver/ssls/
        to: /secure/
        type: rsync

    vars:
      # Secrets Override: If you don't want to use a secrets file you can override secrets here
      # Uncomment and fill in these lines if you want to download the installers for this instance
      # Note that the installer names must match the names on the download server.
      #secrets:
      #  installer_base_url: "https://XXXXXXXXX.XXXXXXXXX.XXX"
      #  installer_url_user: "XXXXXXXXXXXX@XXXXXXXXXXX"
      #  installer_url_pass: "XXXXXXXXXXXX"

      ## Provisioner Debug
      debug_all: true

      ## SSL
      selfsigned_enabled: true
      haproxy_ssl_redirect: true
      letsencrypt_enabled: false
      letsencrypt_staging_enabled: false

      ## Use Proxy for downloads and updates
      use_proxy: false
      proxy_server: 255.255.255.255
      proxy_port: 3128

      ## Extra Packages
      extra_packages: ['htop']

      ## Hosts entries for /etc/hosts
      #etc_hosts_entries:
      #  - hostname:
      #    aliases:
      #      -
      #    ip:

    roles:
      - name: startcloud.startcloud_roles.setup
      - name: startcloud.startcloud_roles.networking
        tags: always
      - name: startcloud.startcloud_roles.disks
      - name: startcloud.startcloud_roles.hostname
      - name: startcloud.startcloud_roles.dependencies
      - name: startcloud.startcloud_roles.guest_additions
      - name: startcloud.startcloud_roles.qemu_guest_agent
      # Generic provisioner: append the roles you need from metadata.roles in
      # provisioner.yml (include each role's depends_on chain first), e.g.:
      #- name: startcloud.startcloud_roles.service_user
      #- name: startcloud.startcloud_roles.cockpit
      #- name: startcloud.startcloud_roles.ssl
      #- name: startcloud.startcloud_roles.quick_start
      #- name: startcloud.startcloud_roles.haproxy
      #- name: startcloud.startcloud_roles.docker
      #- name: startcloud.startcloud_roles.mariadb
