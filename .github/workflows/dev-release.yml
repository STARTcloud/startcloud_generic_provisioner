name: Dev Release

# Publishes a testable dev prerelease for every dependency-bump PR (branches
# named bump/<dep>, opened by dependency-bump.yml). Each push to the PR
# rebuilds and REPLACES one prerelease per PR:
#   tag      v<base>-dev.pr<N>       (base = provisioner.yml version, still
#                                     unbumped — release-please decides the
#                                     real next version only at release time)
#   assets   <name>-<base>-dev.pr<N>.tar.gz + .sha256 (no version-less alias:
#            releases/latest/download ignores prereleases anyway)
# The GitHub prerelease flag is what distinguishes these — the catalog can
# surface or filter dev releases on it later. Closing the PR (merged or not)
# deletes the PR's prereleases and tags, so nothing accumulates.
#
# GITHUB_TOKEN is enough for the release itself: bump branches live in this
# repo, and releases created with GITHUB_TOKEN intentionally do NOT fire the
# release:published trigger — validate.yml stays scoped to real releases. The
# App token is only for stage-seed's dependency downloads (private assets).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ['main']

permissions:
  contents: write

concurrency:
  group: dev-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish dev prerelease
    if: >-
      ${{ github.event.action != 'closed' &&
          startsWith(github.event.pull_request.head.ref, 'bump/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compose dev version
        id: ver
        run: |
          BASE="$(sed -nE 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*)"?.*/\1/p' provisioner.yml | head -n1)"
          VERSION="$BASE-dev.pr${{ github.event.pull_request.number }}"
          echo "Dev version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Mint App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: STARTcloud

      - name: Stage seed archive from the PR head
        id: stage
        uses: ./.github/actions/stage-seed
        with:
          version: ${{ steps.ver.outputs.version }}
          make-latest-alias: 'false'
          token: ${{ steps.app.outputs.token }}

      - name: Replace the PR's prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "$TAG" \
            --notes "Dev build of PR #${{ github.event.pull_request.number }} at $HEAD_SHA. Replaced on every push; deleted when the PR closes." \
            "${{ steps.stage.outputs.artifact }}" \
            "${{ steps.stage.outputs.artifact }}.sha256"

  cleanup:
    name: Delete the PR's dev prereleases
    if: >-
      ${{ github.event.action == 'closed' &&
          startsWith(github.event.pull_request.head.ref, 'bump/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete every dev prerelease tagged for this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match on the -dev.pr<N> suffix, not the base version: the base may
          # have moved between pushes if a release landed mid-PR.
          gh release list --repo "${{ github.repository }}" \
            --json tagName --jq '.[].tagName' \
            | grep -E -- "-dev\.pr${{ github.event.pull_request.number }}$" \
            | while read -r TAG; do
                echo "Deleting $TAG"
                gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
              done
